name: CI

# CI uniquement : vérifie qu'une PR est saine avant merge. Ne déploie rien
# (le déploiement est piloté par l'intégration Vercel/GitHub, cf. docs/deployment.md
# étape 3) et n'exécute aucune commande sur le projet Supabase partagé
# (ADR-001 : ce repo n'a aucun script db:push).

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # TODO(devops) : job `test` (Vitest, ADR architecture.md §8) volontairement
  # absent — aucun répertoire tests/, aucune dépendance vitest et aucun script
  # `pnpm test` n'existent dans ce repo au moment où cette CI a été écrite,
  # bien que docs/architecture.md §8 et §11 (lots L1/L3) décrivent une suite
  # d'intégration Vitest sur Supabase local. À réactiver dès que la suite est
  # commitée : ajouter `supabase/setup-cli`, `supabase db start`, `supabase db
  # reset`, puis `pnpm test`, en s'assurant que `supabase/config.toml` expose
  # bien `club` (déjà le cas) pour que les tests de privilèges (n°10, 11)
  # passent en CI comme en local.

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      # Valeurs bidon suffisantes pour que `next build` compile (aucun appel
      # réseau au moment du build ; les Server Components qui lisent Supabase
      # ne s'exécutent pas pendant `next build`, seulement au runtime/à la
      # requête). Ne jamais mettre de vraies clés ici : ce sont des secrets
      # de repo public/partagé, les vraies valeurs vivent dans Vercel.
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      NEXT_PUBLIC_SITE_URL: "https://placeholder.example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
